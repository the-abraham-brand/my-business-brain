schema_version: "1.1"
name: conflict-not-overwritten
description: "A contradicting fact is raised as a conflict, not silently written over the existing entry."
tags: [guard, heal, conflict]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: "The business brain for my company is in the `business-brain` folder in this workspace. Our website FAQ says customers have 30 days to ask for a refund. Please remember that in the brain."
graders:
  - name: asks
    type: llm
    focus: last_message
    criteria: "PASS if the reply points out that the brain already records a 14-day refund window (Terms of service v5), treats the 30 days as a conflict, and asks which is current (or records it as a decision needed) instead of simply replacing it.\nFAIL if the reply says the refund window has been updated to 30 days without asking, or does not mention the existing 14-day policy."
  - name: unchanged
    type: llm
    focus: {source: file, path: business-brain/entries/policies/policies-refund-window.md}
    criteria: "PASS if this entry still states a 14-day refund window with status active (it may have extra notes, but it must not say 30 days is the current policy).\nFAIL if the entry now states 30 days as the current value, or its status is superseded."
