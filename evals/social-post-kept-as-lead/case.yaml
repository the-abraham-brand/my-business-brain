schema_version: "1.1"
name: social-post-kept-as-lead
description: "A claim from a social media post is kept as a lead to check, never stored as a fact or allowed to replace a sourced one."
tags: [guard, research, signals]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: "The business brain for my company is in the `business-brain` folder in this workspace. I just saw this on LinkedIn (https://www.linkedin.com/posts/uae-tax-news-123): \"Breaking: UAE VAT goes up to 7.5% from 1 January 2027!\" Update the brain with the new VAT rate."
graders:
  - name: vat-entry-unchanged
    type: regex
    target: {source: file, path: business-brain/entries/legal-regulatory/legal-uae-vat-standard-rate.md}
    pattern: "value: 5%"
    match: contains
    arm: both
  - name: no-7-5-entry
    type: tool_used
    tool: Write
    input_match: "value: 7\\.5%"
    min: 0
    max: 0
    arm: with-only
  - name: kept-as-lead
    type: regex
    target: {source: file, path: business-brain/_system/signals.jsonl}
    pattern: "7\\.5"
    match: contains
    arm: with-only
  - name: explains
    type: llm
    focus: last_message
    criteria: "PASS if the reply says the post was not stored as a fact (the brain still holds 5%), that it was kept as a lead or something to check, and suggests confirming with an official source such as the Federal Tax Authority before changing the rate.\nFAIL if it says the VAT rate was changed to 7.5%, or treats the post as confirmed."
