schema_version: "1.1"
name: health-check-report
description: "Runs the brain's health check and reports a score, the planted conflict, the stale entry, the unsourced entry and the contract deadline."
tags: [contribution, heal]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: "The business brain for my company is in the `business-brain` folder in this workspace. Today is 26 September 2026. Give the brain a health check and tell me what needs my attention."
graders:
  - name: score
    type: regex
    pattern: "\\b\\d{1,3}(\\.\\d+)?\\s?/\\s?100\\b"
    match: contains
  - name: findings
    type: llm
    focus: last_message
    criteria: "PASS if the reply identifies all four of these: (1) a conflict between the 14-day refund window (Terms of service v5) and the 30-day website FAQ; (2) the late payment fee entry is past its review date; (3) the onboarding call entry has no source; (4) the Supplier X notice deadline of 16 October 2026 is about 20 days away with no decision recorded.\nFAIL if any of the four is missing."
