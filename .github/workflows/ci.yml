# My Business Brain: checks on every push and pull request, and a release gate.
#
# - validate: the plugin manifest, skills, agents and hooks load (claude plugin validate).
# - unit-tests: the scripts and hooks on Linux, macOS and Windows, oldest and newest Python.
#   Free: no model calls.
# - evals: the behaviour tests in evals/ (claude plugin eval), with and without the plugin.
#   They call the model and are billed to the ANTHROPIC_API_KEY repository secret, so they
#   run only when started by hand (Actions > CI > Run workflow) or when a release tag is pushed.
name: CI

on:
  push:
    branches: [main]
    tags: ["my-business-brain--v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per case per arm (3 is the default; 1 is a cheap smoke test)"
        default: "3"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate .claude-plugin/plugin.json

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  evals:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [validate, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      # The eval sandbox needs bubblewrap and socat on Linux to let cases run Bash.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - name: Run evals
        run: >
          claude plugin eval .
          --trust-plugin --scaffold
          --allow-tools Write Edit Bash
          --runs ${{ github.event.inputs.runs || '3' }}
          --model claude-sonnet-5 --judge-model claude-sonnet-5
          --threshold 0.8 --max-cost-usd 25 --no-publish
          --json eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            eval-results.json
            evals/results/
